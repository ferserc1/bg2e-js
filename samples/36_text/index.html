<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>BG2E · Editable Text</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #252b33;
            color: #f3f5f7;
            font: 15px system-ui
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block
        }

        aside {
            position: fixed;
            top: 20px;
            left: 20px;
            width: min(300px, calc(100vw - 80px));
            background: #17202aee;
            padding: 20px;
            border: 1px solid #ffffff25;
            border-radius: 12px;
            box-shadow: 0 12px 35px #0004
        }

        h1 {
            font-size: 20px;
            margin: 0 0 8px
        }

        p {
            color: #c2ccd8;
            line-height: 1.5;
            font-size: 13px
        }

        label {
            display: block;
            margin: 14px 0 6px
        }

        textarea {
            box-sizing: border-box;
            width: 100%;
            height: 100px;
            resize: vertical;
            background: #0d151e;
            color: white;
            border: 1px solid #66788a;
            border-radius: 6px;
            padding: 10px;
            font: 15px system-ui
        }

        button {
            margin-top: 12px;
            padding: 9px 12px;
            border: 0;
            border-radius: 6px;
            background: #d8e8fa;
            color: #162332;
            cursor: pointer
        }

        #status {
            display: block;
            margin-top: 12px;
            font-size: 12px;
            color: #b9cfdf
        }
    </style>
</head>

<body><canvas id="gl-canvas"></canvas>
    <aside>
        <h1>Text component tutorial</h1>
        <label
            for="content">Content
        </label>
        <textarea id="content" disabled>Hello World</textarea>
        <button id="retry"
            disabled>Reload font</button>
        <span id="status" role="status">Prepearing scene</span>
    </aside>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
