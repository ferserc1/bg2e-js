<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sofa Reorder</title>
    <script type="module" src="src/main.ts"></script>
    <style>
        html, body {
            margin: 0px;
            padding: 0px;
            overflow: hidden;
            font-family: sans-serif;
        }

        canvas {
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 12px 16px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 220px;
        }

        #ui label {
            font-size: 13px;
            font-weight: bold;
        }

        #ui select, #ui button {
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }

        #ui button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        #ui .btn-row {
            display: flex;
            gap: 6px;
        }

        #ui .btn-row button {
            flex: 1;
        }

        #info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
            max-width: 300px;
        }

        #info h3 {
            margin: 0 0 6px 0;
            font-size: 14px;
        }

        #info .children-list {
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        #info .child-item {
            padding: 2px 4px;
            border-radius: 3px;
        }

        #info .child-item.selected {
            background: rgba(0, 150, 255, 0.4);
        }

        #info .child-item.fixed {
            color: #aaa;
            font-style: italic;
        }
    </style>
</head>
<body>
    <canvas id="gl-canvas" width="800" height="600"></canvas>
    <div id="ui"></div>
    <div id="info"></div>
</body>
</html>
