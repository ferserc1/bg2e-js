<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BG2 Engine — PBR IBL</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
      .material-controls { position: fixed; top: 16px; right: 16px; width: 240px; box-sizing: border-box; padding: 18px; border: 1px solid #555; border-radius: 10px; background: #181b20ed; color: #eee; font: 14px system-ui, sans-serif; }
      .material-controls h1 { margin: 0 0 16px; font-size: 17px; }
      .material-controls label { display: block; margin: 14px 0; }
      .material-controls input[type="range"] { display: block; width: 100%; margin: 8px 0; }
      .material-controls input[type="color"], .material-controls output { float: right; }
      .material-controls button { padding: 6px 14px; cursor: pointer; }
      .material-controls p { margin: 14px 0 0; color: #bfc5ce; font-size: 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <canvas id="gl-canvas" width="800" height="600"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
